name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare pinned public source evidence
        run: python -m ternela.setup_demo
      - name: Run deterministic demo
        run: python -m ternela.demo
      - name: Run unit and API tests
        run: python -m ternela.check
      - name: Replay known regression scenarios
        run: python -m ternela.regression
      - name: Check Python source
        run: |
          python -m pip install ruff==0.17.1
          python -m ruff check .
          python -m ruff format --check .
      - name: Check interface JavaScript syntax
        run: node --check workbench/static/app.js
      - name: Build and test Python distributions
        run: |
          python -m pip install 'build>=1.2'
          python -m build
          python scripts/test-wheel.py dist/ternela-$(python -c 'import ternela; print(ternela.__version__)')-py3-none-any.whl
