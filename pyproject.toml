[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ternela"
version = "0.1.2"
description = "Reliable waits and inspectable evidence for agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Ternela contributors"}]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: POSIX"]

[project.optional-dependencies]
dev = ["ruff==0.17.1"]

[project.urls]
Repository = "https://github.com/Alphabetsoup16/ternela"
Issues = "https://github.com/Alphabetsoup16/ternela/issues"

[tool.setuptools.packages.find]
include = ["ternela*", "workbench*", "source_lab*", "expansion_lab*", "safety_lab*", "docs_lab*", "observation_lab*"]

[tool.setuptools.package-data]
ternela = ["brand.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
